<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TransNova</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header Section -->
    <header class="header">
      <div class="header-brand">
        <img src="../icons/icon256.png" alt="TransNova Logo" class="header-logo-img">
        <div class="header-text">
          <h1 class="header-title">TransNova</h1>
          <p class="header-subtitle">Web Chat AI</p>
        </div>
      </div>
      <div class="header-status" id="statusBadge">
        <span class="status-dot"></span>
        <span class="status-text">Active</span>
      </div>
    </header>

    <!-- Main Toggle Row -->
    <div class="card card--toggle">
      <div class="toggle-row">
        <div class="toggle-info">
          <span class="toggle-label">Real-Time Translation</span>
          <span class="toggle-hint" id="toggleHint">Active across chat apps</span>
        </div>
        <label class="switch" id="mainToggle">
          <input type="checkbox" id="enabledToggle" checked>
          <span class="switch-slider">
            <span class="switch-knob"></span>
          </span>
        </label>
      </div>
    </div>

    <!-- Language Selection Row (Side-by-Side) -->
    <div class="card card--languages">
      <div class="lang-group">
        <label class="field-label" for="myLanguageSelect">My Language</label>
        <div class="select-wrapper">
          <select class="custom-select" id="myLanguageSelect">
            <option value="en">🇬🇧 English</option>
            <option value="hi-Latn">🇮🇳 Hinglish</option>
            <option value="hi">🇮🇳 Hindi</option>
            <option value="es">🇪🇸 Spanish</option>
            <option value="fr">🇫🇷 French</option>
            <option value="de">🇩🇪 German</option>
            <option value="zh-CN">🇨🇳 Chinese</option>
            <option value="ja">🇯🇵 Japanese</option>
            <option value="ar">🇸🇦 Arabic</option>
            <option value="pt">🇵🇹 Portuguese</option>
            <option value="ru">🇷🇺 Russian</option>
            <option value="ko">🇰🇷 Korean</option>
            <option value="it">🇮🇹 Italian</option>
            <option value="tr">🇹🇷 Turkish</option>
            <option value="nl">🇳🇱 Dutch</option>
            <option value="pl">🇵🇱 Polish</option>
            <option value="vi">🇻🇳 Vietnamese</option>
            <option value="th">🇹🇭 Thai</option>
            <option value="id">🇮🇩 Indonesian</option>
            <option value="bn">🇧🇩 Bengali</option>
            <option value="pa">🇮🇳 Punjabi</option>
            <option value="gu">🇮🇳 Gujarati</option>
            <option value="ta">🇮🇳 Tamil</option>
            <option value="te">🇮🇳 Telugu</option>
            <option value="mr">🇮🇳 Marathi</option>
            <option value="ur">🇵🇰 Urdu</option>
            <option value="fa">🇮🇷 Persian</option>
            <option value="he">🇮🇱 Hebrew</option>
            <option value="sv">🇸🇪 Swedish</option>
            <option value="uk">🇺🇦 Ukrainian</option>
            <option value="el">🇬🇷 Greek</option>
          </select>
          <div class="select-arrow">▼</div>
        </div>
      </div>

      <button class="swap-icon-btn" id="swapModesBtn" title="Swap My & Partner Language">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="swap-icon">
          <path d="M7 16V4M7 4L3 8M7 4L11 8"/>
          <path d="M17 8V20M17 20L21 16M17 20L13 16"/>
        </svg>
      </button>

      <div class="lang-group">
        <label class="field-label" for="partnerLanguageSelect">Partner Language</label>
        <div class="select-wrapper">
          <select class="custom-select" id="partnerLanguageSelect">
            <option value="hi-Latn">🇮🇳 Hinglish</option>
            <option value="es">🇪🇸 Spanish</option>
            <option value="en">🇬🇧 English</option>
            <option value="hi">🇮🇳 Hindi</option>
            <option value="fr">🇫🇷 French</option>
            <option value="de">🇩🇪 German</option>
            <option value="zh-CN">🇨🇳 Chinese</option>
            <option value="ja">🇯🇵 Japanese</option>
            <option value="ar">🇸🇦 Arabic</option>
            <option value="pt">🇵🇹 Portuguese</option>
            <option value="ru">🇷🇺 Russian</option>
            <option value="ko">🇰🇷 Korean</option>
            <option value="it">🇮🇹 Italian</option>
            <option value="tr">🇹🇷 Turkish</option>
            <option value="nl">🇳🇱 Dutch</option>
            <option value="pl">🇵🇱 Polish</option>
            <option value="vi">🇻🇳 Vietnamese</option>
            <option value="th">🇹🇭 Thai</option>
            <option value="id">🇮🇩 Indonesian</option>
            <option value="bn">🇧🇩 Bengali</option>
            <option value="pa">🇮🇳 Punjabi</option>
            <option value="gu">🇮🇳 Gujarati</option>
            <option value="ta">🇮🇳 Tamil</option>
            <option value="te">🇮🇳 Telugu</option>
            <option value="mr">🇮🇳 Marathi</option>
            <option value="ur">🇵🇰 Urdu</option>
            <option value="fa">🇮🇷 Persian</option>
            <option value="he">🇮🇱 Hebrew</option>
            <option value="sv">🇸🇪 Swedish</option>
            <option value="uk">🇺🇦 Ukrainian</option>
            <option value="el">🇬🇷 Greek</option>
          </select>
          <div class="select-arrow">▼</div>
        </div>
      </div>
    </div>

    <!-- Outgoing (Send As) Selection Card -->
    <div class="card card--setting">
      <div class="card-header-row">
        <span class="card-label">Outgoing (Send)</span>
        <span class="card-badge" id="sendModeBadge">Off</span>
      </div>
      <div class="select-wrapper">
        <select class="custom-select" id="sendModeSelect">
          <option value="off" selected>⛔ Off (Send Original Text)</option>
          <option value="translate" id="sendTranslateOption">🌐 Translate Outgoing Messages</option>
        </select>
        <div class="select-arrow">▼</div>
      </div>
    </div>

    <!-- Incoming (Read As) Selection Card -->
    <div class="card card--setting">
      <div class="card-header-row">
        <span class="card-label">Incoming (Read)</span>
        <span class="card-badge" id="readModeBadge">Off</span>
      </div>
      <div class="select-wrapper">
        <select class="custom-select" id="readModeSelect">
          <option value="off" selected>⛔ Off (Read Original Text)</option>
          <option value="translate" id="readTranslateOption">🌐 Auto-Detect & Translate Incoming</option>
        </select>
        <div class="select-arrow">▼</div>
      </div>
    </div>

    <!-- Platform Connection Info -->
    <div class="card card--platform">
      <div class="platform-row">
        <div class="platform-dot-pulse"></div>
        <span class="platform-name" id="platformName">Detecting chat platform...</span>
      </div>
    </div>

    <!-- Footer Section -->
    <footer class="popup-footer">
      <div class="shortcut-hint">Toggle: <kbd>Alt</kbd> + <kbd>T</kbd></div>
      <div class="developer-credits">By <strong>Yuvraj Singh</strong></div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
